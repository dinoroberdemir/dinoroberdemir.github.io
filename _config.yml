# Academic Pages: https://academicpages.github.io/
# Restart Jekyll after changing this file.
locale: en-US
site_theme: default
title: Dino-Rober Demir
title_separator: "-"
name: Dino-Rober Demir
description: Personal website of Dino-Rober Demir.
url: https://dinoroberdemir.github.io
baseurl: ""
repository: dinoroberdemir/dinoroberdemir.github.io

author:
  avatar: profile.svg
  name: Dino-Rober Demir
  bio:
  location:
  employer:
  email:
  github: dinoroberdemir
  googlescholar:
  orcid:
  linkedin:

breadcrumbs: false
words_per_minute: 160
future: false
read_more: disabled
talkmap_link: false
comments:
  provider: false
analytics:
  provider: false
atom_feed:
  hide: true
og_image: profile.svg

include:
  - _pages
  - files
exclude:
  - .agents
  - .claude
  - .codex
  - .github
  - .bundle
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/theme.js
  - AGENTS.md
  - CLAUDE.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docker-compose.yml
  - docs
  - node_modules
  - output
  - package.json
  - package-lock.json
  - playwright.config.js
  - test
  - vendor

encoding: utf-8
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6

collections:
  publications:
    output: true
    permalink: /publications/:path/
  portfolio:
    output: true
    permalink: /projects/:path/
  teaching:
    output: true
    permalink: /teaching/:path/
  talks:
    output: true
    permalink: /talks/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
      comments: false
      share: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /blog/:year/:title/
timezone: Europe/Paris
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
